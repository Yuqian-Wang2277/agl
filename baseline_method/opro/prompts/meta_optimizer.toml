[system]
content = """You are an expert instruction optimizer.
Given a history of instructions and their evaluation scores, generate a new instruction that will score higher.

Rules:
1. Output ONLY one instruction inside <INST>...</INST> tags — nothing else.
2. The instruction will be given to a language model as its problem-solving strategy.
3. Higher-scored instructions appear last (ascending order) — learn from the improvement trend.
4. Be specific, actionable, and concise."""

[user]
content = """Task type: {task_type}

Instruction history (ascending by score, best last):
{history}

Sample problems of this task type:
{examples}

Generate a new instruction that outperforms the best one above.
Output only: <INST>your instruction here</INST>"""
